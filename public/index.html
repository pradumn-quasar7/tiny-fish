<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sieve — Web Scraper</title>
<meta name="description" content="Paste a URL, describe what you need, and Sieve returns structured rows. Powered by TinyFish." />
<meta name="theme-color" content="#0A0C11" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'><rect width='26' height='26' rx='8' fill='%230A0C11'/><rect x='1' y='1' width='24' height='24' rx='8' fill='none' stroke='%23C8F169' stroke-width='1.6'/><path d='M7 9h12M9 13h8M11 17h4' stroke='%23C8F169' stroke-width='1.6' stroke-linecap='round'/></svg>" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body data-view="workspace">
<div class="blobs" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<div class="app">
  <nav class="side" id="side" aria-label="Primary"></nav>
  <main class="main" id="main">
    <div id="view"></div>
  </main>
</div>

<nav class="bottom-nav" id="bottomNav" aria-label="Primary"></nav>

<!-- overlays -->
<div class="scrim" id="scrim"></div>
<div class="palette" id="palette" role="dialog" aria-label="Search and commands">
  <div class="p-in">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="paletteInput" type="text" placeholder="Search runs, datasets, extractors — or type a command" autocomplete="off" aria-label="Search" />
    <span class="kbd">esc</span>
  </div>
  <ul id="paletteList" role="listbox"></ul>
</div>
<div class="sheet" id="sheet" role="dialog" aria-label="Live log">
  <div class="sh-head"><b id="sheetTitle">Live log</b><button class="btn btn-sm" data-act="close-overlays">Close</button></div>
  <div class="sh-body" id="sheetBody"></div>
</div>
<div id="popHost"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
